name: תזכורות יומיות
on:
  schedule:
    - cron: '0 5 * * *'   # כל יום ב-08:00 שעון ישראל (07:00 בחורף)
  workflow_dispatch:
    inputs:
      force:
        description: 'לשלוח התראת בדיקה עכשיו'
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev
        working-directory: notify
      - run: node notify.mjs
        working-directory: notify
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE: ${{ github.event.inputs.force }}
      # GitHub משבית משימות מתוזמנות אחרי 60 יום בלי פעילות. פעם בחודש נרשם קובץ קטן כדי שזה לא יקרה.
      - name: keepalive
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u > .keepalive
            git config user.name "garage-bot"
            git config user.email "garage-bot@users.noreply.github.com"
            git add .keepalive && git commit -m "keepalive" && git push
          fi
